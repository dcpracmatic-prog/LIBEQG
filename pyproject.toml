[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libeqg"
version = "0.1.0"
description = "Prueba inmutable y comparador de proveedores QPU con evidencia cifrada y verificable"
requires-python = ">=3.10"
dependencies = ["cryptography>=42,<47"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
libeqg = "libeqg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
