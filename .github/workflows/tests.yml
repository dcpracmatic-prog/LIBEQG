name: LIBEQG tests

on:
  push:
    branches: [main, library-autovalidation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and base test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run complete base suite
        run: python -m pytest -v

  qiskit-aer-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Aer CPU test dependencies
        run: python -m pip install -e ".[test,phase-c-aer]"
      - name: Execute Aer CPU integration test
        run: python -m pytest -v tests/test_phase_c_simulators.py::test_aer_executes_on_cpu_when_installed

  cudaq-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Upgrade pip for CUDA-Q wheels
        run: python -m pip install --upgrade pip
      - name: Install CUDA-Q CPU test dependencies (cudaq)
        run: python -m pip install -e ".[test,phase-c-cudaq]"
      - name: Execute CUDA-Q qpp-cpu integration test
        run: python -m pytest -v tests/test_phase_c_simulators.py::test_cudaq_executes_on_qpp_cpu_when_installed
